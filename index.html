<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Content Security Policy -->
  <!-- 
    script-src: 'self' 'unsafe-inline' for Vite HMR. No 'unsafe-eval'.
    style-src: 'self' 'unsafe-inline' (Google Fonts and dynamic styles).
    img-src: 'self' data: https: (for loaded images).
    connect-src: Whitelisted to Supabase, Google AI, NVIDIA API only.
    font-src: 'self' https://fonts.gstatic.com (Google Fonts).

    Production guidance:
    - Prefer removing 'unsafe-inline' by using nonces/hashes, and keep CSP as strict as possible.
    - If you proxy third-party AI requests through your own backend, remove direct NVIDIA/Google endpoints from connect-src.
    - Storing API keys in the browser (localStorage/sessionStorage) cannot protect against XSS; the safest setup is a backend proxy or short-lived tokens.
  -->
  <!-- 
    Content Security Policy (Report-Only) - 僅用於開發測試與移轉期間收集違規報告。
    使用時可取消下方註解，並將下方的強制執行(Enforce) meta 註解掉。
    <meta http-equiv="Content-Security-Policy-Report-Only" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https: blob:;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://*.supabase.co https://generativelanguage.googleapis.com https://integrate.api.nvidia.com;
      media-src 'self' https: blob:;
    ">
  -->
  <!-- 優先由 vercel.json 提供；此 meta 僅為 dev fallback -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    img-src 'self' data: https: blob:;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://*.supabase.co https://generativelanguage.googleapis.com https://api.openai.com https://integrate.api.nvidia.com;
    media-src 'self' https: blob:;
    object-src 'none';
  ">

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>MindSpark - AI 學習助手</title>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
